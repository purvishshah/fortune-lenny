<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Fortune Lenny</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <img src="assets/logo.jpg" class="cookie-icon" />

  <div class="card-wrapper">
    <main class="card">
      <h1 id="quoteText"></h1>
      <p id="speakerText" class="speaker"></p>
    </main>

    <!-- Broken fortune cookie -->
    <svg class="fortune-cookie-svg" viewBox="-15 -10 295 145" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="cL" x1="10%" y1="0%" x2="90%" y2="100%">
          <stop offset="0%" stop-color="#f2d060"/>
          <stop offset="45%" stop-color="#dea028"/>
          <stop offset="100%" stop-color="#a86c14"/>
        </linearGradient>
        <linearGradient id="cR" x1="90%" y1="0%" x2="10%" y2="100%">
          <stop offset="0%" stop-color="#f0cc54"/>
          <stop offset="45%" stop-color="#d09820"/>
          <stop offset="100%" stop-color="#b07818"/>
        </linearGradient>
        <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fffef8"/>
          <stop offset="100%" stop-color="#ede6cf"/>
        </linearGradient>
      </defs>

      <!-- Paper strip — sits between the two halves -->
      <rect x="105" y="0" width="24" height="68" rx="2" fill="url(#paper)" stroke="#d0c8a8" stroke-width="0.6"/>
      <line x1="111" y1="16" x2="123" y2="16" stroke="#bab090" stroke-width="1"/>
      <line x1="111" y1="24" x2="123" y2="24" stroke="#bab090" stroke-width="1"/>
      <line x1="111" y1="32" x2="121" y2="32" stroke="#bab090" stroke-width="1"/>
      <line x1="111" y1="40" x2="123" y2="40" stroke="#bab090" stroke-width="1"/>

      <!-- LEFT half — falls bottom-left, rotated -22° -->
      <g transform="translate(-8, 5) rotate(-22, 40, 55)">
        <path d="M 90 28 C 75 8, 32 2, 8 26 C -8 48, -4 82, 20 98 C 44 112, 80 106, 90 86 C 82 70, 80 50, 90 28 Z"
              fill="url(#cL)" stroke="#7a4a18" stroke-width="1.8" stroke-linejoin="round"/>
        <!-- inner fold crease -->
        <path d="M 90 28 C 72 38, 48 48, 30 50 C 12 52, -2 58, -4 66"
              fill="none" stroke="#7a4a18" stroke-width="1.2" stroke-opacity="0.45" stroke-linecap="round"/>
        <!-- top highlight -->
        <path d="M 90 28 C 78 12, 50 6, 30 10 C 16 13, 6 22, 8 26 C 22 12, 55 8, 90 28 Z"
              fill="rgba(255,240,140,0.38)"/>
        <!-- bottom shadow rim -->
        <path d="M 20 98 C 44 112, 80 106, 90 86 C 80 100, 46 110, 20 98 Z"
              fill="rgba(0,0,0,0.1)"/>
      </g>

      <!-- RIGHT half — falls bottom-right, rotated +12° (asymmetric) -->
      <g transform="translate(8, 8) rotate(12, 205, 60)">
        <path d="M 150 28 C 164 6, 212 0, 240 22 C 266 44, 266 82, 246 100 C 224 118, 182 112, 150 90 C 160 74, 160 50, 150 28 Z"
              fill="url(#cR)" stroke="#7a4a18" stroke-width="1.8" stroke-linejoin="round"/>
        <!-- inner fold crease -->
        <path d="M 150 28 C 168 38, 194 46, 212 48 C 230 50, 248 56, 252 66"
              fill="none" stroke="#7a4a18" stroke-width="1.2" stroke-opacity="0.45" stroke-linecap="round"/>
        <!-- top highlight -->
        <path d="M 150 28 C 162 8, 194 2, 220 8 C 234 12, 244 22, 240 22 C 224 8, 188 4, 150 28 Z"
              fill="rgba(255,240,140,0.38)"/>
        <!-- bottom shadow rim -->
        <path d="M 246 100 C 224 118, 182 112, 150 90 C 168 106, 212 116, 246 100 Z"
              fill="rgba(0,0,0,0.1)"/>
      </g>
    </svg>

    <!-- Cookie crumbles scattered around -->
    <span class="crumb s2 c1"></span>
    <span class="crumb s1 c2"></span>
    <span class="crumb s3 c3"></span>
    <span class="crumb s1 c4"></span>
    <span class="crumb s2 c5"></span>
    <span class="crumb s3 c6"></span>
    <span class="crumb s1 c7"></span>
    <span class="crumb s2 c8"></span>
    <span class="crumb s3 c9"></span>
    <span class="crumb s1 c10"></span>
  </div>

  <footer class="footer">
    <h3>Fortune Lenny</h3>
    <p>
      Your daily dose of wisdom on products, growth and more <br />
      Made with ❤️ by <a href="https://www.linkedin.com/in/meetpurvish/" target="_blank" class="footer-link">Purvish</a> + Claude |
      Credits <a href="https://www.linkedin.com/in/lennyrachitsky/" target="_blank" class="footer-link">@lenny</a>
    </p>
  </footer>

  <script src="newtab.js"></script>

</body>
</html>
